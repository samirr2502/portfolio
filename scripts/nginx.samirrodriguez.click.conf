# Portfolio — static Vite app + Ask Samir API (PM2: portfolio-api → :3020)
# Frontend: /var/www/samirrodriguez.click
# Cert: /etc/letsencrypt/live/samirrodriguez.click/ (all three hostnames)

server {
    server_name samirrodriguez.click www.samirrodriguez.click portfolio.samirrodriguez.click;

    root /var/www/samirrodriguez.click;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/samirrodriguez.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samirrodriguez.click/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name samirrodriguez.click www.samirrodriguez.click portfolio.samirrodriguez.click;
    return 301 https://$host$request_uri;
}
